platform:
  log:
    level: debug
    filepath: ./log.txt
    FileLoggingEnabled: false
#    megabytes
    MaxSize: 1024
    MaxBackups: 10
#    Days
    MaxAge: 30
  http:
    server:
      listeningaddress: 0.0.0.0:9111
      tlscertfilename: ""
      tlskeyfilename: ""
      tlsenabled: false
      AllowCorsForLocalDevelopment: true
      # Server timeouts in seconds. Omit to use the defaults (5/30/60/120).
      readheadertimeoutseconds: 5
      readtimeoutseconds: 30
      writetimeoutseconds: 60
      idletimeoutseconds: 120
    clients:
    - id: default
      tlsverify: false
      maxidleconnections: 10
      requesttimeout: 10
    - id: custom
      tlsverify: false
      maxidleconnections: 10
      requesttimeout: 10
  auth:
    server:
      oauth:
        enabled: false
        idpwellknownurl: ""
        clientid: ""
        # Claim that carries roles. Literal key first (e.g. a Zitadel URN),
        # then a dotted path. Supports string lists and object keys.
        rolesclaim: roles
        allowedalgorithms:
        - rs256
        - rs384
      basic:
        enabled: false
        allowedusers:
          user1: pass1
          user2: pass2
    client:
      oauth:
        - id: default
          renewCheckIntervalSeconds: 10
          renewCheckTimeMinutes: 5
          IdpTokenEndpoint: ""
          clientid: federate-token-client
          clientsecret: a4fed4bd-81d9-4267-8506-3fe805b7dc27
          username:
          password:
          vaultEnabled: true
          vaultPath: secret/data/test
          vaultClientIdKey: client-id
          vaultClientSecretKey: client-secret
          vaultUsernameKey: username
          vaultPasswordKey: password
          vaultIdpTokenEndpointKey: token-endpoint
        - id: exsternalApi
          idpwellknownurl: ""
          clientid: remoteClientID
          clientsecret: remote secret
          username: test username
          password: testpassword
  component:
    componentname: Unit Test
  grpc:
    server:
      listeningaddress: 0.0.0.0:9001
      tlscertfilename: ""
      tlskeyfilename: ""
      tlsenabled: false
      # CORS allow-list for browser gRPC-Web traffic. When empty, the
      # http.server.AllowCorsForLocalDevelopment flag falls back to "*".
      allowedorigins: []
      # Server timeouts in seconds. Omit to use the defaults (5/30/60/120).
      readheadertimeoutseconds: 5
      readtimeoutseconds: 30
      writetimeoutseconds: 60
      idletimeoutseconds: 120
      # Maximum request size in bytes. 0 uses the Connect default.
      maxreceivemessagebytes: 0
  database:
    boltdb:
      enabled: true
      filename: ./bolt.db
      # How long to wait for the file lock before failing. Defaults to 5.
      opentimeoutseconds: 5
  vault:
    enabled: false
    addresslist:
      - 'http://localhost:8200'
    InsecureSkipVerify: true
    IsLocalAgent: false
    MaxRetries: 2
    cacert: ''
    timeoutSeconds: 10
    Token:
      enabled: true
#      This must be empty if you want to use the token here in the config.
#      The token path will be used first
      TokenPath: ''
      token: "s.aRADbzy3XXaH6dEj3hvHC3BN"
    Cert:
      enabled: false
      CertFile: './client.cer'
      KeyFile: './client.key'
