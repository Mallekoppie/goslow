platform:
  log:
    # debug
    # info
    # warn
    # error
    level: info
    filepath: "./log.txt"
  http:
    server:
      listeningaddress: 0.0.0.0:9111
      tlscertfilename: ""
      tlskeyfilename: ""
      tlsenabled: false
    clients:
    - id: default
      tlsverify: false
      maxidleconnections: 10
      requesttimeout: 10
    - id: custom
      tlsverify: false
      maxidleconnections: 10
      requesttimeout: 10
  auth:
    server:
      oauth:
        enabled: true
        idpwellknownurl: "http://localhost:8080/auth/realms/master"
        clientid: "federate-token-server"
        allowedalgorithms:
        - rs256
        - rs384
        # Keycloak puts realm roles under realm_access.roles. The routes in this
        # example require the "user" role. Read it from that dotted path (or
        # configure a Keycloak mapper that emits a top-level roles claim).
        rolesclaim: realm_access.roles
      # Basic Auth adds 75 - 80 ms to the response time - queue sad face :(
      # Passwords must be hashed using bcrypt. Unencrypted passwords will not work
      basic:
        enabled: false
        allowedusers:
          test: $2a$10$zX3HVDhKWRg2YWrf5VuHYutOOfj4DY.Wk7CsFgEFNgFmQqKBEumJG
          user2: pass2
    client:
      oauth:
#        owntokens:
#        - id: default
#          idpwellknownurl: ""
#          clientid: test client ID
#          clientsecret: some secret
#          username: test username
#          password: testpassword
#        - id: exsternalApi
#          idpwellknownurl: ""
#          clientid: remoteClientID
#          clientsecret: remote secret
#          username: test username
#          password: testpassword
  component:
    componentname: Example platform service
  database:
    boltdb:
      enabled: true
      filename: ./database.db
  # Vault is disabled because this example does not ship the client
  # certificate/key pair that cert auth would load, and the server does not read
  # secrets from Vault. Enable it and supply CertFile/KeyFile (cert auth) or
  # token settings if you add Vault-backed configuration.
  vault:
    enabled: false
    addresslist:
      - 'https://localhost:8200'
    InsecureSkipVerify: true
    IsLocalAgent: false
    MaxRetries: 2
    cacert: ''
    timeoutSeconds: 10
    Token:
      enabled: false
      #      This must be empty if you want to use the token here in the config.
      #      The token path will be used first
      TokenPath: ''
      token: ""
    Cert:
      enabled: false
      CertFile: ''
      KeyFile: ''


componentconfigexample:
  name: my custom config
  port: 9001